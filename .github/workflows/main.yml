name: Orbito CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build ConsoleApp
        run: |
          cd Jeu/ConsoleAppOrbito/
          dotnet restore ConsoleAppOrbito.csproj
          dotnet build ConsoleAppOrbito.csproj -c Release --no-restore
          dotnet publish ConsoleAppOrbito.csproj -c Release --no-restore -o ../../build/release

      - name: Lancement des Tests
        run: |
          cd Jeu/OrbitoTests/
          dotnet restore OrbitoTests.csproj
          dotnet test OrbitoTests.csproj -c Release --no-restore

  deploy-site:
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparation des fichiers web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Docker' 

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4